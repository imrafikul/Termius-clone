<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Network Tunnel Hex / Shield Shield Center -->
  <g transform="translate(256, 256)">
    <!-- Outer Shield / Hexagon -->
    <polygon points="0,-160 140,-80 140,80 0,160 -140,80 -140,-80" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- VPN Tunnel Pipes -->
    <path d="M-80,-40 C -30,-80 30,-80 80,-40 C 30,0 -30,0 -80,-40" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <path d="M-90,0 C -40,-40 40,-40 90,0 C 40,40 -40,40 -90,0" fill="none" stroke="url(#glowGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M-80,40 C -30,0 30,0 80,40 C 30,80 -30,80 -80,40" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" />
    
    <!-- Central Tunnel Node -->
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
    <circle cx="0" cy="0" r="14" fill="#38bdf8" />

    <!-- Terminal Prompt Sub-Icon -->
    <text x="0" y="105" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="28" font-weight="bold">&gt;_ PPTP</text>
  </g>
</svg>
