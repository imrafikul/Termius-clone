name: pptp_solution
description: "A production-grade Android network management app for ISP engineers and MikroTik administrators with user-space PPTP VpnService, strict split tunneling, embedded SSH terminal, and network diagnostics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Embedded MikroTik Terminal
  dartssh2: ^2.11.2
  xterm: ^3.7.0

  # Local Persistence for ISP Profiles & Preferences
  shared_preferences: ^2.2.2

  # Networking & Utility
  connectivity_plus: ^5.0.2
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  flutter_svg: ^2.0.9

  # UI & Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
