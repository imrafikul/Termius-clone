name: Build Android PPTP Solution APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Setup Android Build Scaffolding & Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          chmod +x android/gradlew 2>/dev/null || true
          cd android
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.5 || true
          fi
          chmod +x gradlew 2>/dev/null || true
          cd ..

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pptp-solution-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "PPTP Solution Latest Release APK"
          body: |
            ### PPTP Solution Android APK (Ready To Install)
            - **Universal APK:** `app-release.apk`
            - **Features:** Android VpnService, Full Internet VPN (`0.0.0.0/0`), Split Tunnel, MikroTik Terminal, Network Diagnostics.
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
